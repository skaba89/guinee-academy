<!doctype html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Guinée Academy</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/pwa-192x192.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/pwa-192x192.png" />
  <link rel="apple-touch-icon" href="/pwa-192x192.png" />
  <meta name="description"
    content="Plateforme SaaS multi-tenant de gestion scolaire complète. Gérez admissions, élèves, notes, finances et communications." />
  <meta name="author" content="Guinée Academy" />

  <!-- Content Security Policy -->
  <!-- SECURITY: unsafe-inline removed from script-src — all scripts are external (src attribute).
       style-src retains unsafe-inline (needed for Google Fonts & CSS-in-JS).
       Note: require-trusted-types-for removed to allow ServiceWorker registration.
       Trusted Types policy is created programmatically in src/main.tsx instead. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self';
             script-src 'self' https://browser.sentry-cdn.com https://cdn.onesignal.com;
             style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.onesignal.com;
             font-src 'self' https://fonts.gstatic.com;
             img-src 'self' data: blob: https:;
             connect-src 'self' https: http://localhost:* ws://localhost:* https://*.sentry.io https://*.onesignal.com https://api.onesignal.com;
             frame-src 'none';
             object-src 'none';
             base-uri 'self';
             form-action 'self';">

  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()" />

  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#1e40af" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Guinée Academy" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="format-detection" content="telephone=no" />

  <!-- iOS Icons -->
  <link rel="apple-touch-icon" sizes="192x192" href="/pwa-192x192.png" />
  <link rel="apple-touch-icon" sizes="512x512" href="/pwa-512x512.png" />

  <!-- Canonical -->
  <link rel="canonical" href="https://academyguinee.com/" />

  <!-- Open Graph -->
  <meta property="og:title" content="Guinée Academy — Gestion Scolaire Intelligente" />
  <meta property="og:description" content="Plateforme SaaS de gestion scolaire multi-établissements. Inscriptions, notes, paiements, communication — tout en un." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://academyguinee.com/" />
  <meta property="og:image" content="https://academyguinee.com/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:locale" content="fr_FR" />
  <meta property="og:site_name" content="Guinée Academy" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Guinée Academy — Gestion Scolaire Intelligente" />
  <meta name="twitter:description" content="Plateforme SaaS de gestion scolaire multi-établissements. Inscriptions, notes, paiements, communication — tout en un." />
  <meta name="twitter:image" content="/og-image.png" />
</head>

<body>
  <!-- ============================================================
       KILL OLD SERVICE WORKERS — runs BEFORE any app code.
       Removes leftover Workbox/PWA service workers from previous
       deployments that cause 'no-response' errors.
       ============================================================ -->
  <script src="/sw-killer.js"></script>
  <div id="root"></div>
  <!-- Runtime config: loaded before app, NOT bundled by Vite. Edit dist/config.js on server. -->
  <script src="/config.js"></script>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
