# =============================================================================
# Guinée Academy — Render Blueprint (render.yaml)
# =============================================================================
# Deploy to Render with:  render blueprint apply
# Documentation: https://render.com/docs/blueprint-spec
# =============================================================================
#
# ARCHITECTURE on Render:
#   - guinee-academy-db   (PostgreSQL) — managed database
#   - guinee-academy-api  (FastAPI)    — backend API
#   - guinee-academy (Node)  — frontend SPA + API proxy
#
# The frontend proxies /api/* to the backend, so the browser only talks
# to one domain. No CORS issues.
#
# =============================================================================

databases:
  # ─── PostgreSQL (Render Managed) ─────────────────────────────────────────
  - name: guinee-academy-db
    databaseName: guinee_academy
    region: frankfurt
    plan: starter


services:
  # ─── Redis (token versioning, session mutex) ─────────────────────────────
  - type: redis
    name: guinee-academy-redis
    region: frankfurt
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  # ─── Backend API (FastAPI) ───────────────────────────────────────────────
  - type: web
    name: guinee-academy-api
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    # NOTE: Do NOT run "alembic upgrade head" here — alembic.ini has an empty
    # sqlalchemy.url, so it would fail and block uvicorn via &&.
    # The app's lifespan handler in main.py runs migrations automatically
    # with the correct DATABASE_URL.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    rootDir: ./backend
    envVars:
      # --- Database (auto-linked by Render from guinee-academy-db) ---
      - key: DATABASE_URL
        fromDatabase:
          name: guinee-academy-db
          property: connectionString
      - key: DATABASE_URL_ASYNC
        fromDatabase:
          name: guinee-academy-db
          property: connectionString
      - key: DATABASE_URL_SYNC
        fromDatabase:
          name: guinee-academy-db
          property: connectionString

      # --- Application ---
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"

      # --- Admin (CHANGEZ ce mot de passe apres le 1er login!) ---
      - key: ADMIN_DEFAULT_EMAIL
        value: admin@guinee-academy.local
      - key: ADMIN_DEFAULT_PASSWORD
        generateValue: true  # Secure auto-generated password — check Render dashboard after deploy

      # --- Security ---
      - key: BOOTSTRAP_SECRET
        generateValue: true
      - key: METRICS_SECRET
        generateValue: true
      - key: ENFORCE_MFA
        value: "true"

      # --- CORS ---
      - key: BACKEND_CORS_ORIGINS
        fromService:
          name: guinee-academy
          type: web
          property: host

      # --- Redis (token versioning, session mutex) ---
      - key: REDIS_URL
        fromService:
          name: guinee-academy-redis
          type: redis
          property: connectionString

      # --- AI (optionnel) ---
      - key: GROQ_API_KEY
        sync: false

  # ─── Frontend (React SPA + API proxy via server.mjs) ─────────────────────
  - type: web
    name: guinee-academy
    runtime: node
    region: frankfurt
    plan: free
    # NOTE: --include=dev is required because NODE_ENV=production (set below)
    # causes npm to skip devDependencies. vite and plugins are in devDeps.
    buildCommand: npm install --include=dev && npm run build
    startCommand: node server.mjs
    rootDir: .
    envVars:
      - key: NODE_ENV
        value: production
      # VITE_API_URL = backend hostname (resolved by Render via fromService).
      # server.mjs prepends https:// and uses it as the proxy target.
      - key: VITE_API_URL
        fromService:
          name: guinee-academy-api
          type: web
          property: host
