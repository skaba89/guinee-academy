# =============================================================================
# SchoolFlow Pro — Continuous Integration Pipeline
# =============================================================================
# Runs on push to main and pull_request to main.
# Six independent jobs:
#   1. frontend: lint + typecheck + test + build
#   2. backend: ruff lint + syntax + security + pytest (SQLite)
#   3. backend-tests: pytest (PostgreSQL)
#   4. e2e: Playwright end-to-end tests
#   5. security: dependency + secret scanning
#   6. coverage: aggregate coverage reports
# Designed to complete in under 8 minutes.
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Frontend: lint + type-check + test + build ────────────────────────────
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint (ESLint)
        run: npx eslint . --max-warnings 5000

      - name: Type-check (TypeScript)
        run: npm run type-check

      - name: Run frontend tests with coverage
        run: npm run test -- --coverage --reporter=verbose
        env:
          CI: true

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: coverage/
          retention-days: 7

      - name: Build (Vite)
        run: npm run build
        env:
          CI: true

  # ── Backend: ruff lint + syntax + security + pytest (SQLite) ──────────────
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install ruff mypy pytest-cov

      - name: Lint (Ruff)
        run: cd backend && ruff check app/ tests/ --output-format=github

      - name: Type-check (mypy)
        run: cd backend && mypy app/ --ignore-missing-imports --no-error-summary || true
        continue-on-error: true

      - name: Validate Python syntax (all app files)
        run: |
          ERRORS=0
          for f in $(find backend/app -name "*.py"); do
            if ! python -m py_compile "$f" 2>/dev/null; then
              echo "FAIL: $f"
              ERRORS=$((ERRORS + 1))
            fi
          done
          echo "Checked all Python files. Errors: $ERRORS"
          exit $ERRORS

      - name: Check for hardcoded secrets
        run: |
          echo "Scanning for hardcoded secrets in backend..."
          SECRETS_FOUND=0
          if rg -l 'password\s*=\s*["\x27][^"\x27]{4,}["\x27]' backend/app/ --type py 2>/dev/null; then
            echo "WARNING: Possible hardcoded password found"
            SECRETS_FOUND=1
          fi
          if rg -l 'SECRET.*=\s*["\x27][^"\x27]{8,}["\x27]' backend/app/ --type py 2>/dev/null; then
            echo "WARNING: Possible hardcoded secret found"
            SECRETS_FOUND=1
          fi
          if [ $SECRETS_FOUND -eq 0 ]; then
            echo "No hardcoded secrets detected"
          fi

      - name: Check for dangerous patterns
        run: |
          echo "Scanning for dangerous patterns..."
          if rg -l '\beval\s*\(' backend/app/ --type py 2>/dev/null; then
            echo "WARNING: eval() found in backend code"
          fi
          if rg -l '\bexec\s*\(' backend/app/ --type py 2>/dev/null; then
            echo "WARNING: exec() found in backend code"
          fi
          if rg -l 'pickle\.load' backend/app/ --type py 2>/dev/null; then
            echo "WARNING: pickle.load (insecure deserialization) found"
          fi
          if rg -l 'shell\s*=\s*True' backend/app/ --type py 2>/dev/null; then
            echo "WARNING: subprocess with shell=True found"
          fi

      - name: Run backend tests (SQLite) with coverage
        run: |
          cd backend && python -m pytest tests/ -v --tb=short \
            --cov=app --cov-report=term-missing --cov-report=xml \
            --cov-fail-under=30
        env:
          DATABASE_URL: sqlite:///./test.db
          DEBUG: "true"
          SECRET_KEY: test-secret-key-for-ci-min-32-chars
          BOOTSTRAP_SECRET: test-bootstrap-secret-key-for-ci-32chars

      - name: Upload backend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-sqlite
          path: backend/coverage.xml
          retention-days: 7

  # ── Backend E2E: SQLite compatibility smoke test (auth-bypass) ───────────
  # Runs the in-repo e2e_sqlite_bypass.py harness that seeds a throwaway
  # SQLite DB and exercises 40+ endpoints looking for PostgreSQL-only SQL
  # leaking through to the SQLite code path. This is a HARD GATE —
  # any SQL_LEAK / SQL_ERROR marker fails the build.
  backend-e2e-sqlite:
    name: Backend E2E (SQLite smoke)
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pytest-cov httpx

      - name: Run e2e_sqlite_bypass.py
        run: |
          cd backend && python scripts/e2e_sqlite_bypass.py --check-leaks
        env:
          DEBUG: "true"
          SECRET_KEY: test-secret-key-for-ci-min-32-chars
          BOOTSTRAP_SECRET: test-bootstrap-secret-key-for-ci-32chars
          REDIS_URL: redis://localhost:6379/0
          GROQ_API_KEY: ""
          STORAGE_BACKEND: local

      - name: Upload E2E test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-e2e-sqlite-logs
          path: |
            backend/e2e_test.db
            backend/guinee_academy.db
          retention-days: 3
          if-no-files-found: ignore

  # ── Backend Tests: PostgreSQL integration ────────────────────────────────
  backend-tests:
    name: Backend Tests (PostgreSQL)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env.docker from example (for docker-compose)
        run: |
          # docker-compose.yml references env_file: .env.docker which is
          # gitignored. Create a CI-safe copy from the example so compose
          # can start the postgres service.
          cp .env.docker.example .env.docker
          # Override with CI-specific values (must match DATABASE_URL below)
          sed -i 's|^POSTGRES_DB=.*|POSTGRES_DB=schoolflow_test|' .env.docker
          sed -i 's|^POSTGRES_USER=.*|POSTGRES_USER=schoolflow|' .env.docker
          sed -i 's|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=testpassword|' .env.docker
          sed -i 's|^POSTGRES_PORT=.*|POSTGRES_PORT=5432|' .env.docker
          # Redis password (required by redis service healthcheck, even if not used by tests)
          sed -i 's|^REDIS_PASSWORD=.*|REDIS_PASSWORD=ciredispassword|' .env.docker
          echo "Created .env.docker for CI"

      - name: Start PostgreSQL service
        run: |
          docker compose -f docker-compose.yml up postgres -d --wait
        env:
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: schoolflow_test
          POSTGRES_USER: schoolflow

      - name: Wait for PostgreSQL to be ready
        run: |
          for i in $(seq 1 30); do
            if docker compose -f docker-compose.yml exec -T postgres pg_isready -U schoolflow -d schoolflow_test > /dev/null 2>&1; then
              echo "PostgreSQL is ready"
              break
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt && pip install pytest-cov

      - name: Run backend tests (PostgreSQL) with coverage
        run: |
          cd backend && python -m pytest tests/ -v --tb=short \
            --cov=app --cov-report=term-missing --cov-report=xml \
            --cov-fail-under=30
        env:
          DATABASE_URL: postgresql://schoolflow:testpassword@localhost:5432/schoolflow_test
          SECRET_KEY: test-secret-key-for-ci-min-32-chars
          BOOTSTRAP_SECRET: test-bootstrap-secret-key-for-ci-32chars

      - name: Upload backend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-postgres
          path: backend/coverage.xml
          retention-days: 7

      - name: Stop PostgreSQL service
        if: always()
        run: docker compose -f docker-compose.yml down -v

  # ── E2E: Playwright end-to-end tests ────────────────────────────────────
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [frontend, backend, backend-e2e-sqlite]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Create .env.docker from example (for docker-compose)
        run: |
          # docker-compose.yml references env_file: .env.docker which is
          # gitignored. Create a CI-safe copy from the example so compose
          # can start the postgres + redis services.
          cp .env.docker.example .env.docker
          sed -i 's|^POSTGRES_DB=.*|POSTGRES_DB=schoolflow_test|' .env.docker
          sed -i 's|^POSTGRES_USER=.*|POSTGRES_USER=schoolflow|' .env.docker
          sed -i 's|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=testpassword|' .env.docker
          sed -i 's|^POSTGRES_PORT=.*|POSTGRES_PORT=5432|' .env.docker
          sed -i 's|^REDIS_PASSWORD=.*|REDIS_PASSWORD=ciredispassword|' .env.docker
          echo "Created .env.docker for CI"

      - name: Start services (Docker Compose)
        run: |
          docker compose -f docker-compose.yml up -d postgres redis
          sleep 5

      - name: Wait for PostgreSQL to be ready
        run: |
          for i in $(seq 1 30); do
            if docker compose -f docker-compose.yml exec -T postgres pg_isready -U schoolflow -d schoolflow_test > /dev/null 2>&1; then
              echo "PostgreSQL is ready"
              exit 0
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done
          echo "PostgreSQL did not become ready in 60s"
          docker compose -f docker-compose.yml logs postgres
          exit 1

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run Alembic migrations (pre-migrate for visibility)
        # Run migrations BEFORE starting uvicorn so that any migration error
        # is visible directly in CI logs (instead of being hidden inside the
        # detached uvicorn process). `alembic upgrade head` is idempotent,
        # so the lifespan event will re-run it as a fast no-op.
        run: |
          cd backend && python -m alembic upgrade head
        env:
          DATABASE_URL: postgresql://schoolflow:testpassword@localhost:5432/schoolflow_test
          SECRET_KEY: test-secret-key-for-ci-min-32-chars
          BOOTSTRAP_SECRET: test-bootstrap-secret-key-for-ci-32chars
          DEBUG: "true"

      - name: Start backend
        # Start uvicorn in background with logs captured to /tmp/backend.log
        # so we can inspect them if the API fails to come up.
        run: |
          cd backend && nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/backend.log 2>&1 &
          echo "Backend PID: $!"
          sleep 10
          # Quick smoke check — if uvicorn has already crashed, fail fast.
          if ! kill -0 $! 2>/dev/null; then
            echo "❌ Backend process died during startup. Logs:"
            cat /tmp/backend.log
            exit 1
          fi
          echo "Backend process is alive after 10s. Continuing..."
        env:
          DATABASE_URL: postgresql://schoolflow:testpassword@localhost:5432/schoolflow_test
          SECRET_KEY: test-secret-key-for-ci-min-32-chars
          BOOTSTRAP_SECRET: test-bootstrap-secret-key-for-ci-32chars
          DEBUG: "true"

      - name: Build and start frontend
        run: |
          npm run build
          npx vite preview --host 0.0.0.0 --port 3000 &
          sleep 5
        env:
          CI: true

      - name: Run Playwright tests
        run: npx playwright test --reporter=html
        env:
          CI: true
          BASE_URL: http://localhost:3000
          API_URL: http://localhost:8000

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Debug — backend logs (on failure)
        if: failure()
        run: |
          echo "=== Backend logs (last 200 lines) ==="
          tail -n 200 /tmp/backend.log 2>/dev/null || echo "(no backend.log found)"
          echo ""
          echo "=== Docker compose status ==="
          docker compose -f docker-compose.yml ps 2>/dev/null || true
          echo ""
          echo "=== curl http://localhost:8000/api/v1/health/ ==="
          curl -sS --max-time 5 http://localhost:8000/api/v1/health/ 2>&1 || echo "(curl failed)"

      - name: Upload backend logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-logs
          path: /tmp/backend.log
          if-no-files-found: warn
          retention-days: 7

      - name: Stop services
        if: always()
        run: docker compose -f docker-compose.yml down -v

  # ── Security: dependency vulnerability scan ─────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run npm audit
        run: |
          npm audit --audit-level=high --json > audit-results.json 2>&1 || true
          HIGH_COUNT=$(python3 -c "import json; d=json.load(open('audit-results.json')); print(sum(1 for v in d.get('vulnerabilities',{}).values() if v.get('severity') in ('high','critical'))" 2>/dev/null || echo 0)
          if [ "$HIGH_COUNT" -gt 0 ]; then
            echo "::error::$HIGH_COUNT high/critical npm vulnerabilities found"
            npm audit --audit-level=high
            exit 1
          fi
          echo "No high/critical vulnerabilities"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit on backend
        run: |
          # --output=json requires an output path via -o (not --output-file).
          # Run pip-audit with explicit -o; on failure, re-run with desc for logs.
          pip-audit -r backend/requirements.txt --desc -o pip-audit-results.json || {
            echo "::error::Vulnerable Python dependencies found"
            cat pip-audit-results.json
            exit 1
          }
          echo "No known vulnerabilities found"

      - name: Check for .env files in git
        run: |
          echo "Checking for committed .env files..."
          ENV_FILES=$(git ls-files | grep -E '\.env$|\.env\.' | grep -v '.env.example' | grep -v '.env.docker.example' | grep -v '.env.production.template' | grep -v '\.env.template' | grep -v 'templates/.*\.env' | grep -v '\.env\.clean\.py' || true)
          if [ -n "$ENV_FILES" ]; then
            echo "ERROR: .env files committed to git:"
            echo "$ENV_FILES"
            exit 1
          else
            echo "No .env files committed to git"
          fi

      - name: Check for credential files
        run: |
          echo "Checking for committed credential files..."
          # Look for actual credential files (not source code that happens
          # to mention "password" or "credentials" in its filename).
          # Excluded: source files (.py, .ts, .tsx, .js, .jsx), migrations,
          # UI components, documentation.
          CRED_FILES=$(git ls-files \
            | grep -iE 'credentials|password|secret.*\.txt|\.pem$|\.key$' \
            | grep -vE '\.(py|ts|tsx|js|jsx|md|json|ya?ml|txt)$' \
            | grep -vE 'alembic/versions/' \
            || true)
          if [ -n "$CRED_FILES" ]; then
            echo "ERROR: Possible credential files committed:"
            echo "$CRED_FILES"
            exit 1
          else
            echo "No credential files committed to git"
          fi

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
